
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Task management</title>

    <link rel="stylesheet" href="./css/main.css">
    
    <script type="module" src="./scripts/index.js"></script>
<body>
    <template id="fields">
        <div id="forms-container">
            <form id="list-form">
                <input id="list-title" type="text" placeholder="List Title (e.g. High)">
                <button type="submit">Add List</button>
            </form>
            <hr>
            <form id="task-form">
                <input id="task-title" type="text" placeholder="Task Title">
                <input id="task-desc" type="text" placeholder="Description">
                <select id="task-list-select"></select>
                <button type="submit">Add Task</button>
            </form>
        </div>
    </template>

    <template id="list">
        <div class="projects">
            <header class="title-header">
                <h1 class="title"></h1>
                <button class="delete-list">X</button>
            </header>
            <ul class="project-list"></ul>
        </div>
    </template>

    <template id="project-item">
        <li class="project" draggable="true">
            <h2 class="project_title"></h2>
            <p class="project_desc"></p>
            <div class="project_icons">
                <button class="edit">Edit</button>
                <button class="delete">Delete</button>
            </div>
        </li>
    </template>

    <div id="app"></div>
</body>
</html>
